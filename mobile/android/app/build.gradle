plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android { namespace "com.mdless.mobile"; compileSdk flutter.compileSdkVersion; ndkVersion "27.0.12077973"
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = JavaVersion.VERSION_17 }
    defaultConfig { applicationId "com.mdless.mobile"; minSdk 24; targetSdk flutter.targetSdkVersion; versionCode 1; versionName "0.1.0" }
}

dependencies {
    // Native Telegram-compatible private-call media transport. TDLib remains
    // the signaling/authentication layer in Dart.
    implementation "io.github.pytgcalls:ntgcalls:3.0.0-rc03"
}

flutter { source '../..' }
